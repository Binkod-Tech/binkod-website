<title>Device Matrix - Pulse Monitor Light</title>
<desc>Smartphone outline with a diagnostic pulse waveform and a blue CPU chipset carrying a centered information symbol.</desc>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbfdff"/><stop offset=".55" stop-color="#e4eff9"/><stop offset="1" stop-color="#d7e7f5"/>
  </linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <linearGradient id="chipSheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
    <stop offset=".38" stop-color="#ffffff" stop-opacity=".05"/>
    <stop offset=".62" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="1" stop-color="#020b16" stop-opacity=".16"/>
  </linearGradient>
  <linearGradient id="metalRim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".34" stop-color="#e2eef9"/>
    <stop offset=".66" stop-color="#9db4c9"/><stop offset="1" stop-color="#607c97"/>
  </linearGradient>
  <linearGradient id="pinGold" x1="0" y1="0" x2=".35" y2="1">
    <stop offset="0" stop-color="#fff9e3"/><stop offset=".26" stop-color="#f4d98f"/>
    <stop offset=".62" stop-color="#ddb25a"/><stop offset=".85" stop-color="#b3832f"/>
    <stop offset="1" stop-color="#7e5a1c"/>
  </linearGradient>
  <filter id="chipShadow" x="-35%" y="-35%" width="170%" height="170%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020b16" flood-opacity="0.44"/>
  </filter>
  <filter id="waveGlow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="chipClip"><rect x="248" y="266" width="130" height="130" rx="20"/></clipPath>
</defs>

