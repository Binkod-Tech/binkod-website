    <circle cx="242" cy="224" r="54" fill="none" stroke="#6ee7f9" stroke-opacity=".25"/>
    <path d="M215 242c-8-20 1-45 24-56M269 206c10 20 3 46-19 58" fill="none" stroke="#7db2ff" stroke-opacity=".45" stroke-width="1.5"/>
