      <path d="M521 108l7-14 7 14M523 103h10" fill="none" stroke="#7db2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="555" y="98" fill="#f2f6ff" font-size="15" font-weight="700">Learn</text>
      <text x="555" y="117" fill="#8899ba" font-size="11">Ask, practise, understand</text>
    </g>
