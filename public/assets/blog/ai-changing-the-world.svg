<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="title desc">
  <title id="title">AI connecting with everyday life</title>
  <desc id="desc">An abstract illustration of an AI core linked to learning, creativity, communication and problem solving.</desc>
  <defs>
    <linearGradient id="world-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071022"/>
      <stop offset="0.58" stop-color="#0a1730"/>
      <stop offset="1" stop-color="#0c1e3e"/>
    </linearGradient>
    <radialGradient id="world-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4f9dff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#4f9dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="world-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7db2ff"/>
      <stop offset="1" stop-color="#6ee7f9"/>
    </linearGradient>
    <pattern id="world-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#8db8ff" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#world-bg)"/>
  <rect width="800" height="450" fill="url(#world-grid)"/>
  <circle cx="242" cy="224" r="188" fill="url(#world-glow)"/>

  <g fill="none" stroke="#8db8ff" stroke-opacity=".2">
    <circle cx="242" cy="224" r="142" stroke-dasharray="3 9"/>
    <circle cx="242" cy="224" r="108" stroke-dasharray="2 7"/>
    <ellipse cx="242" cy="224" rx="176" ry="70" transform="rotate(-18 242 224)" stroke-opacity=".13"/>
    <path d="M365 155c62 8 91 36 108 70" stroke-dasharray="4 8"/>
    <path d="M373 290c64-4 94-28 112-56" stroke-dasharray="4 8"/>
    <path d="M360 226h64" stroke-dasharray="4 8"/>
  </g>

  <g>
