<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="title desc">
  <title id="title">A simplified request path through a software system</title>
  <desc id="desc">Stacked layers show a person's request moving through an application interface, processing, services and data, with a result returned.</desc>
  <defs>
    <linearGradient id="arch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061220"/>
      <stop offset=".6" stop-color="#081a2b"/>
      <stop offset="1" stop-color="#0a1f31"/>
    </linearGradient>
    <linearGradient id="arch-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff"/>
      <stop offset=".5" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <pattern id="arch-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#8db8ff" stroke-opacity=".06"/>
    </pattern>
    <filter id="arch-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#arch-bg)"/>
  <rect width="800" height="450" fill="url(#arch-grid)"/>
  <ellipse cx="400" cy="235" rx="220" ry="130" fill="#2f7bff" fill-opacity=".08" filter="url(#arch-glow)"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <g>
      <rect x="210" y="55" width="380" height="52" rx="14" fill="#0b1d34" stroke="#7db2ff" stroke-opacity=".28"/>
      <circle cx="238" cy="81" r="10" fill="#7db2ff" fill-opacity=".15"/>
      <circle cx="238" cy="81" r="3.4" fill="#7db2ff"/>
      <text x="258" y="86" fill="#eef4ff" font-size="13" font-weight="700">User request</text>
      <text x="560" y="86" text-anchor="end" fill="#7f92b5" font-size="10" font-weight="700" letter-spacing="1.4">01</text>
    </g>

    <g>
      <rect x="210" y="132" width="380" height="52" rx="14" fill="#0b2039" stroke="#6ee7f9" stroke-opacity=".3"/>
      <rect x="232" y="149" width="18" height="18" rx="4" fill="none" stroke="#6ee7f9" stroke-opacity=".65" stroke-width="1.7"/>
      <path d="M232 154h18M238 159h6" stroke="#6ee7f9" stroke-opacity=".65" stroke-width="1.4"/>
      <text x="263" y="163" fill="#eef4ff" font-size="13" font-weight="700">Application interface</text>
      <text x="560" y="163" text-anchor="end" fill="#7f92b5" font-size="10" font-weight="700" letter-spacing="1.4">02</text>
    </g>

    <g>
      <rect x="210" y="209" width="380" height="52" rx="14" fill="#0b2039" stroke="#7db2ff" stroke-opacity=".3"/>
      <path d="M232 229h18M232 237h18M232 245h10" stroke="#7db2ff" stroke-opacity=".65" stroke-width="1.7" stroke-linecap="round"/>
      <text x="263" y="240" fill="#eef4ff" font-size="13" font-weight="700">Processing layer</text>
      <text x="560" y="240" text-anchor="end" fill="#7f92b5" font-size="10" font-weight="700" letter-spacing="1.4">03</text>
    </g>

    <g>
      <rect x="210" y="286" width="380" height="52" rx="14" fill="#0b2039" stroke="#a78bfa" stroke-opacity=".34"/>
      <circle cx="241" cy="312" r="4" fill="#c4b5fd"/>
      <circle cx="257" cy="312" r="4" fill="#c4b5fd" fill-opacity=".55"/>
      <circle cx="273" cy="312" r="4" fill="#c4b5fd" fill-opacity=".28"/>
      <text x="292" y="317" fill="#eef4ff" font-size="13" font-weight="700">Services, data and tools</text>
      <text x="560" y="317" text-anchor="end" fill="#7f92b5" font-size="10" font-weight="700" letter-spacing="1.4">04</text>
    </g>

    <g>
      <rect x="210" y="363" width="380" height="52" rx="14" fill="#0c2a31" stroke="#a7f3d0" stroke-opacity=".38"/>
      <path d="M232 384l6 6 11-12" fill="none" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="263" y="394" fill="#eef4ff" font-size="13" font-weight="700">Result returned to the user</text>
      <text x="560" y="394" text-anchor="end" fill="#7f92b5" font-size="10" font-weight="700" letter-spacing="1.4">05</text>
    </g>
  </g>

  <g stroke-linecap="round">
    <path d="M400 107v17M400 184v17M400 261v17M400 338v17" stroke="url(#arch-accent)" stroke-width="2.2"/>
    <path d="M400 184v17M400 261v17M400 338v17" stroke="#6ee7f9" stroke-width="2.2"/>
    <path d="M400 184v17M400 261v17M400 338v17" stroke="#6ee7f9" stroke-width="2.2"/>
    <path d="M400 184v17M400 261v17M400 338v17" stroke="#6ee7f9" stroke-width="2.2"/>
    <g fill="#6ee7f9">
      <path d="M395 120l5 8 5-8z"/>
      <path d="M395 197l5 8 5-8z"/>
      <path d="M395 274l5 8 5-8z"/>
      <path d="M395 351l5 8 5-8z"/>
    </g>
  </g>

  <g>
    <circle cx="646" cy="81" r="3" fill="#6ee7f9"/>
    <circle cx="664" cy="96" r="2" fill="#6ee7f9" fill-opacity=".55"/>
    <circle cx="676" cy="78" r="1.6" fill="#6ee7f9" fill-opacity=".35"/>
    <rect x="630" y="209" width="76" height="52" rx="12" fill="#081728" stroke="#8db8ff" stroke-opacity=".14" stroke-dasharray="4 5"/>
    <text x="668" y="231" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#657a9e">PERMISSIONS</text>
    <text x="668" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#657a9e">checked</text>
    <path d="M650 253h36" stroke="#6ee7f9" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"/>
    <path d="M650 253h20" stroke="#6ee7f9" stroke-opacity=".65" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="126" cy="209" r="36" fill="none" stroke="#7db2ff" stroke-opacity=".12"/>
    <circle cx="126" cy="209" r="22" fill="none" stroke="#7db2ff" stroke-opacity=".2" stroke-dasharray="3 6"/>
    <circle cx="126" cy="209" r="4" fill="#6ee7f9"/>
    <path d="M146 227l18 18" stroke="#7db2ff" stroke-opacity=".2" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
