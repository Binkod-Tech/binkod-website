<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="title desc">
  <title id="title">A product development blueprint</title>
  <desc id="desc">A blueprint-style flow from idea to plan, design, build and release, above an application wireframe.</desc>
  <defs>
    <linearGradient id="lab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061021"/>
      <stop offset="1" stop-color="#0b1b36"/>
    </linearGradient>
    <linearGradient id="lab-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff"/>
      <stop offset=".55" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="lab-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#9bc4ff" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#lab-bg)"/>
  <rect width="800" height="450" fill="url(#lab-grid)"/>
  <g stroke="#7db2ff" stroke-opacity=".12">
    <path d="M40 60h28M54 46v28" />
    <path d="M730 60h28M744 46v28" />
    <path d="M40 396h28" />
    <path d="M730 396h28" />
  </g>

  <text x="62" y="62" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6f83a8">PRODUCT WORKBENCH</text>

  <g fill="none" stroke="#8db8ff" stroke-opacity=".2">
    <path d="M90 124h620" stroke-dasharray="3 8"/>
  </g>
  <path d="M90 124h620" fill="none" stroke="url(#lab-line)" stroke-width="2.5" stroke-dasharray="2 12" stroke-linecap="round"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <g>
      <circle cx="112" cy="124" r="24" fill="#0d2546" stroke="#7db2ff" stroke-opacity=".8" stroke-width="2"/>
      <circle cx="112" cy="124" r="6" fill="#7db2ff"/>
      <text x="112" y="173" fill="#eef4ff" font-size="12" font-weight="700">Idea</text>
    </g>
    <g>
      <circle cx="256" cy="124" r="24" fill="#0d2546" stroke="#68d8ea" stroke-opacity=".8" stroke-width="2"/>
      <path d="M247 124h18M256 115v18" stroke="#6ee7f9" stroke-width="2" stroke-linecap="round"/>
      <text x="256" y="173" fill="#eef4ff" font-size="12" font-weight="700">Plan</text>
    </g>
    <g>
      <circle cx="400" cy="124" r="24" fill="#171f4b" stroke="#a78bfa" stroke-opacity=".8" stroke-width="2"/>
      <path d="M391 130l7-14 9 8-9 8z" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="400" y="173" fill="#eef4ff" font-size="12" font-weight="700">Design</text>
    </g>
    <g>
      <circle cx="544" cy="124" r="24" fill="#0d2546" stroke="#7db2ff" stroke-opacity=".8" stroke-width="2"/>
      <path d="M535 132l6-16 6 16M538 126h8" fill="none" stroke="#7db2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="544" y="173" fill="#eef4ff" font-size="12" font-weight="700">Build</text>
    </g>
    <g>
      <circle cx="688" cy="124" r="24" fill="#143046" stroke="#6ee7f9" stroke-opacity=".8" stroke-width="2"/>
      <path d="M679 127l6 6 12-13" fill="none" stroke="#6ee7f9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="688" y="173" fill="#eef4ff" font-size="12" font-weight="700">Release</text>
    </g>
  </g>

  <g>
