    <rect x="90" y="213" width="390" height="34" rx="16" fill="#0d1f3b"/>
    <circle cx="113" cy="230" r="4" fill="#ef6f6c"/>
    <circle cx="128" cy="230" r="4" fill="#fbbf24"/>
    <circle cx="143" cy="230" r="4" fill="#34d399"/>
    <rect x="112" y="268" width="118" height="86" rx="9" fill="#0c203d" stroke="#7db2ff" stroke-opacity=".2"/>
    <rect x="126" y="282" width="68" height="7" rx="3.5" fill="#7db2ff" fill-opacity=".6"/>
    <rect x="126" y="298" width="88" height="5" rx="2.5" fill="#7db2ff" fill-opacity=".18"/>
    <rect x="126" y="310" width="76" height="5" rx="2.5" fill="#7db2ff" fill-opacity=".18"/>
    <rect x="126" y="327" width="58" height="15" rx="7.5" fill="#2b6cf2" fill-opacity=".75"/>
    <rect x="248" y="268" width="100" height="43" rx="9" fill="#0c203d" stroke="#7db2ff" stroke-opacity=".2"/>
    <rect x="260" y="280" width="47" height="6" rx="3" fill="#6ee7f9" fill-opacity=".55"/>
    <rect x="260" y="294" width="66" height="4" rx="2" fill="#7db2ff" fill-opacity=".18"/>
    <rect x="362" y="268" width="100" height="43" rx="9" fill="#0c203d" stroke="#7db2ff" stroke-opacity=".2"/>
    <rect x="374" y="280" width="38" height="6" rx="3" fill="#c4b5fd" fill-opacity=".55"/>
    <rect x="374" y="294" width="61" height="4" rx="2" fill="#7db2ff" fill-opacity=".18"/>
    <rect x="248" y="326" width="214" height="28" rx="8" fill="#0c203d" stroke="#7db2ff" stroke-opacity=".16"/>
    <path d="M262 340h120" stroke="#7db2ff" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>
    <path d="M262 340h74" stroke="#7db2ff" stroke-opacity=".62" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="520" y="213" width="190" height="82" rx="14" fill="#0b1b34" stroke="#8db8ff" stroke-opacity=".22"/>
    <text x="540" y="242" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6f83a8">NEXT STEP</text>
    <text x="540" y="264" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#eef4ff">Review the result</text>
    <path d="M540 279h92" stroke="#6ee7f9" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
    <path d="M540 279h48" stroke="#6ee7f9" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="520" y="314" width="190" height="75" rx="14" fill="#101d3c" stroke="#a78bfa" stroke-opacity=".25"/>
    <path d="M543 337l6-10 6 10M579 337l6-10 6 10M615 337l6-10 6 10" fill="none" stroke="#c4b5fd" stroke-opacity=".65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="540" y="363" font-family="system-ui, sans-serif" font-size="11" fill="#8899ba">AI assists, we review.</text>
  </g>
